name: Secret Scanning

on:
  push:
    branches: [ main, develop, luffy ]
  pull_request:
    branches: [ main, develop, luffy ]
  # Run on schedule to catch any missed secrets
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8am UTC

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        # Fetch entire history for better detection
        fetch-depth: 0

    - name: Run Trivy Security Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        # Specifically look for secrets
        scanners: 'secret'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Gitleaks Secret Scanner
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for common API key patterns
      run: |
        echo "Checking for potential API keys in code..."

        # Define patterns to search for
        patterns=(
          "sk-[a-zA-Z0-9]{20,}"
          "sk-proj-[a-zA-Z0-9_-]{100,}"
          "AKIA[0-9A-Z]{16}"
          "AIza[0-9A-Za-z_-]{35}"
          "ya29\.[0-9A-Za-z\-_]+"
          "AAEA[a-zA-Z0-9]{60}"
          "\"api_key\":\s*\"[^\"]{20,}\""
          "\"apikey\":\s*\"[^\"]{20,}\""
          "\"token\":\s*\"[^\"]{20,}\""
        )

        # Check each pattern
        found=0
        for pattern in "${patterns[@]}"; do
          if grep -r -E "$pattern" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude="*.json" \
            --exclude="*.csv" \
            --exclude="*.npy" \
            --exclude=".env.example" \
            --exclude="secret-scan.yml" \
            2>/dev/null; then
            echo "⚠️ WARNING: Potential secret found matching pattern: $pattern"
            found=1
          fi
        done

        if [ $found -eq 1 ]; then
          echo "❌ Potential secrets detected! Please review and remove them."
          exit 1
        else
          echo "✅ No obvious secrets detected in the codebase."
        fi

    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::🔐 Security scan failed! Potential secrets detected in the repository."
        echo "::error::Please review the findings and remove any exposed secrets immediately."
        echo "::error::If you committed API keys, rotate them immediately at your provider's dashboard."
