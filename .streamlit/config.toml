# Streamlit Theme Configuration
# Override default red theme with neon green/blue

[theme]
primaryColor = "#C1E329"              # Neon green (primary accent)
backgroundColor = "#0E1117"           # Dark background
secondaryBackgroundColor = "#141414"  # Slightly lighter dark
textColor = "#ffffff"                 # White text (NO RED)
font = "sans serif"

[server]
headless = true
